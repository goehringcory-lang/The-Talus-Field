# CI for the editorial guards, the PWA, and the Worker.
#
# The editorial site at the repo root is static by design (hand-written CSS,
# jsx sources precompiled into /dist by scripts/gen-compiled.mjs), and it
# auto-deploys from main via the Cloudflare Workers Build — so the guard
# suite that used to be local-only runs here too. Without it, stale dist/,
# stale SEO mirrors, or an untagged article could merge and deploy with
# nothing failing. The nightly system-checks.yml still covers the live site.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  editorial:
    name: Editorial guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            apps/guide/package-lock.json
      - run: npm ci
        working-directory: scripts
      # The guard suite's last step (check:itineraries) runs from apps/guide.
      - run: npm ci
        working-directory: apps/guide
      # Cache-busters, SEO mirrors, prerender + compiled-dist + home-shell +
      # archive freshness, archive citations, guide photos, intent tags,
      # itinerary placements.
      - run: npm --prefix scripts run check
      # The offline health battery: links, per-page SEO/JSON-LD, sitemap,
      # feed, image hygiene. Errors fail; length warnings do not.
      - run: npm --prefix scripts run checks

  pwa:
    name: PWA build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/guide/package-lock.json
      - run: npm ci
      - run: npm run build
      # A rebuild of unchanged source must emit a byte-identical build. Without
      # this, a clock read anywhere in the build makes every no-op redeploy a
      # forced update for every installed copy of the guide.
      - run: npm run check:build
      - run: npm run lint

  worker:
    name: Worker typecheck and flow test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Hermetic purchase-flow e2e (mocked KV, stubbed Stripe/Resend): checkout,
      # webhook provisioning, auth exchange/login, refund revocation.
      - run: npm run test:flow
