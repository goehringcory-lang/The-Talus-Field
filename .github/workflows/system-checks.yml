# Nightly system-checks suite: SEO/render/distribution health for the editorial
# site (links, sitemap, feed, per-page SEO, og:image, JSON-LD, image hygiene,
# email-auth), API Worker health, plus a Lighthouse Core Web Vitals trend.
#
# The site auto-deploys from main to Cloudflare Pages, so the live origin is the
# right target for the online checks. Search-engine notification of new URLs is
# already handled by indexnow.yml on push; this workflow does not duplicate it.
#
# The API check (checks/api.mjs) is the reason this run is not editorial-only.
# api.thetalusfieldjournal.com deploys through a gated Workers Build: a merge
# touching workers/ runs the typecheck and tests, then deploys, and a failure
# ships nothing and leaves the previous version live with no other signal. It
# is where the money lives. This is the thing that notices before a buyer does.
#
# Runs nightly and on manual dispatch. The checks job fails on error-severity
# findings; Lighthouse is warn-only (drift is recorded, not gated) to avoid flaky
# nightly failures.
#
# The lighthouse job also records the editorial deploy-parity verdict
# (scripts/deploy-parity-log.mjs -> scripts/data/deploy-parity-log.json): which
# Worker version production is serving and whether its frozen catalog matches
# the asset layer and the repo. It is the memory the August 2026 stale-build
# incidents lacked (CLAUDE.md, "Things that have surprised past edits"): a
# rollback shows as a version id and a verdict changing on a night with no
# commit. Both files ride the same nightly commit. Note that this commit itself
# re-triggers the editorial Workers Build ([skip ci] is a GitHub convention
# Cloudflare does not honor), which is why the log records a new version id
# most nights and why that is not, by itself, the regression.

name: System checks

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: SEO / render / distribution checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - name: Run system checks (online)
        run: node system-checks.mjs --online --report=data/last-run-report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-checks-report
          path: scripts/data/last-run-report.md

  lighthouse:
    name: Lighthouse trend and deploy-parity log
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: Record deploy parity
        # Builtins only, no npm ci needed. An unreachable origin must not block
        # the Lighthouse record, and vice versa.
        continue-on-error: true
        run: node scripts/deploy-parity-log.mjs
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://thetalusfieldjournal.com/
            https://thetalusfieldjournal.com/articles/yosemite-heat-safety-guide
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Append to history
        run: node scripts/lighthouse-log.mjs
      - name: Commit history (scheduled/dispatch only)
        # always(): a Lighthouse failure must still commit the parity record.
        if: always() && github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- scripts/data/lighthouse-history.json scripts/data/deploy-parity-log.json; then
            echo "No Lighthouse history or deploy-parity change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/data/lighthouse-history.json scripts/data/deploy-parity-log.json
          git commit -m "chore: record nightly Lighthouse run [skip ci]"
          git push
