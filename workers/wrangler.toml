name = "talus-field-guide-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Replace `id` with the value printed by:
#   wrangler kv namespace create GUIDE_BUYERS
# Replace `preview_id` with the value from:
#   wrangler kv namespace create GUIDE_BUYERS --preview
# Besides buyer records, this namespace holds the /api/trip/plan cross-device
# sync (tripsync:<sub> plus the hourly tripsyncWriteAttempts:* counters), the
# /api/push device registrations, and the various hashed-IP rate-limit counters.
[[kv_namespaces]]
binding = "GUIDE_BUYERS"
id = "4d2bf553bdd249448407094e3d282825"
preview_id = "REPLACE_ME_FOR_LOCAL_DEV"

# Program/event cache for /api/programs (daily cron ingest of the NPS Events
# API). Create with:
#   wrangler kv namespace create GUIDE_PROGRAMS
#   wrangler kv namespace create GUIDE_PROGRAMS --preview
[[kv_namespaces]]
binding = "GUIDE_PROGRAMS"
id = "b705140335d148e29f7e61aac8147c33"
preview_id = "REPLACE_ME_FOR_LOCAL_DEV"

# Staging inbox for remote photo uploads (/api/photos/* and the /photos
# upload page). Camera originals wait here until the photo-import GitHub
# workflow pulls them through scripts/ingest-photos.mjs and opens a PR;
# nothing is ever served from this bucket. Create it BEFORE the next deploy
# (a declared-but-missing bucket fails `wrangler deploy`):
#   wrangler r2 bucket create talus-photo-inbox
# Then set the gate secret (e.g. `openssl rand -hex 24`):
#   wrangler secret put PHOTO_UPLOAD_TOKEN
# and add the SAME value as the GitHub repo secret PHOTO_UPLOAD_TOKEN so the
# workflow can download staged files. Optional, for the upload page's
# "Run import" button (otherwise start the workflow from the Actions tab):
#   wrangler secret put GITHUB_DISPATCH_TOKEN   # fine-grained PAT, this repo,
#                                               # Contents: read & write
[[r2_buckets]]
binding = "PHOTO_INBOX"
bucket_name = "talus-photo-inbox"

# Two daily runs, branched on controller.cron in index.ts:
#   0 10 * * * (~2-3am Pacific)  — data refresh (NPS programs, weather,
#     conditions feeds) plus the renewal EMAIL sweep. Quiet-hours work only.
#   0 15 * * * (7-8am Pacific year round) — the push sweep alone. Notices are
#     phone buzzes, so they go out in the park's morning; sweepPush also gates
#     itself on the 6-11am window as a backstop.
# The programs route also self-heals: if KV is missing or >48h old it fetches
# NPS live and backfills.
[triggers]
crons = ["0 10 * * *", "0 15 * * *"]

# APP_BASE_URL is the PWA's public origin. It feeds every buyer-facing link
# the Worker emits: the magic-link (`${APP_BASE_URL}/open?token=`), the access
# email's wordmark image and /login links (email.ts derives them from it), and
# the CORS fallback origin. The custom domain is attached; the pages.dev origin
# stays in the CORS allowlist in src/index.ts so magic links already sent
# against it keep working.
#
# These MUST live under [vars]. As bare keys after [triggers] above, TOML
# folds them into the triggers table and wrangler drops them, leaving
# c.env.APP_BASE_URL and friends undefined at runtime.
[vars]
APP_BASE_URL = "https://guide.thetalusfieldjournal.com"
EDITORIAL_BASE_URL = "https://thetalusfieldjournal.com"
GUIDE_PRICE_CENTS = "399"
# Discounted renewal price (MONETIZATION-IDEAS.md 2.1): buyers near or past
# their 548-day expiry rebuy at this price via /api/checkout/renew. Renewals
# bypass the monthly cap and never touch inventory.
GUIDE_RENEWAL_PRICE_CENTS = "249"
GUIDE_PRODUCT_TAG = "field_guide_2026"
GUIDE_MONTHLY_CAP = "100"

# Routes the Worker to api.thetalusfieldjournal.com.
#
# This is a Custom Domain, not a zone route pattern, and the distinction is
# load-bearing rather than stylistic. A Custom Domain owns the hostname and
# creates its own proxied DNS record, so there is no CNAME to add by hand; a
# `/*` route pattern only matches traffic on a hostname whose DNS already
# exists. The domain was attached in the dashboard, which left this file
# describing a mechanism the deployed Worker was not using.
#
# Declaring it here is what keeps `wrangler deploy` safe. Wrangler reconciles
# the deployed Worker's routes against this file and prompts to "override the
# remote configuration with your local one", so a config that omits the Custom
# Domain offers to DETACH it on every deploy — which would take the DNS record
# with it and leave api.thetalusfieldjournal.com unresolvable, breaking auth,
# Stripe checkout and its webhook, the programs feed, and the editorial
# /widget preview at once. Do not "fix" this back to a `/*` pattern.
[[routes]]
pattern = "api.thetalusfieldjournal.com"
custom_domain = true

# === Pre-Stripe dev / admin sign-in =========================================
# /api/auth/dev-login accepts a username + code pair and issues the same JWT
# the post-purchase login does, so we can preview the PWA without Stripe.
# Set both pairs as secrets:
#   wrangler secret put DEV_USERNAME      # e.g. "preview"
#   wrangler secret put DEV_CODE          # any string you'll remember
#   wrangler secret put ADMIN_USERNAME    # e.g. "cory"
#   wrangler secret put ADMIN_CODE        # any string you'll remember
# Either pair lets you in. Remove or rotate before public launch.
# ===========================================================================

# === NPS Events API =========================================================
# /api/programs and the daily cron read the National Park Service Events API.
# Free key, self-serve signup at developer.nps.gov/get-started:
#   wrangler secret put NPS_API_KEY
# Optional; without it the feed serves manual curation only. The same key
# serves the park-alerts endpoint behind /api/alerts (road status, closures,
# chain controls); without it /api/alerts serves empty and the PWA renders
# no conditions lines.
# ===========================================================================

# === AirNow AQI =============================================================
# /api/air reads the AirNow current-observations API for the Valley AQI line
# (smoke season). Free key, self-serve signup at docs.airnowapi.org:
#   wrangler secret put AIRNOW_API_KEY
# Optional; without it /api/air serves nulls and the PWA renders no AQI line.
# /api/flow (Merced River at Happy Isles, USGS) is keyless and needs nothing.
# ===========================================================================

# === IndexNow push-indexing =================================================
# /api/indexnow/submit forwards URL lists to api.indexnow.org so Bing,
# Yandex, Seznam, Naver, and Yep all see the change at once. Both secrets
# are required for the endpoint to function:
#   wrangler secret put INDEXNOW_KEY           # the 32-char hex string also
#                                              # served at /<key>.txt
#   wrangler secret put INDEXNOW_ADMIN_TOKEN   # gates POST /api/indexnow/submit
# Without them the route returns 503. See scripts/indexnow-ping.sh.
# ===========================================================================

# === Calendar ===============================================================
# There is no server-side calendar integration. The PWA renders the trip as an
# .ics file client-side and hands it to the OS (apps/guide/src/trip/ics.ts +
# exportTrip.ts), so nothing about a buyer's calendar reaches the Worker: no
# Google OAuth client, no hosted feed, no refresh tokens in KV.
# ===========================================================================

# === Local dev override ====================================================
# For local development, copy this file to wrangler.local.toml and replace
# the URLs above with their localhost equivalents. wrangler picks it up via:
#   wrangler dev --config wrangler.local.toml
# ===========================================================================
